<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DentAI — 3D Scan Analysis</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Icon-only sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo" title="DentAI">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 3C12.5 3 9.5 5 9 8C8.3 6 6.5 4.5 4.5 4.5C2.5 4.5 1 6 1 8C1 12 5 17 9 21C9.5 18.5 10.5 16.5 12 15.5C13 14.8 14.5 14.5 16 14.5C17.5 14.5 19 14.8 20 15.5C21.5 16.5 22.5 18.5 23 21C27 17 31 12 31 8C31 6 29.5 4.5 27.5 4.5C25.5 4.5 23.7 6 23 8C22.5 5 19.5 3 16 3Z" fill="currentColor"/>
      </svg>
    </div>

    <ul class="sidebar-nav">
      <li class="sidebar-item active" data-tooltip="Scan Analysis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
      </li>
      <li class="sidebar-item" data-tooltip="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <polyline points="12 7 12 12 15 15"/>
        </svg>
      </li>
      <li class="sidebar-item" data-tooltip="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
        </svg>
      </li>
    </ul>

    <div class="sidebar-user" data-tooltip="Dr. Michaels">
      <div class="user-avatar">DM</div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="main-content">

    <!-- Top bar -->
    <header class="top-bar">
      <div class="page-info">
        <h1 class="page-title">3D Scan Analysis</h1>
        <div class="mode-switch">
          <button class="mode-btn active" data-mode="showcase" id="modeBtnShowcase">Showcase</button>
          <button class="mode-btn" data-mode="full" id="modeBtnFull">Full Run</button>
        </div>
      </div>

      <div class="stepper" id="stepper">
        <div class="step-item" data-step="0">
          <div class="step-dot"><span>1</span></div>
          <span class="step-label">Load Scan</span>
        </div>
        <div class="step-connector"></div>
        <div class="step-item" data-step="1">
          <div class="step-dot"><span>2</span></div>
          <span class="step-label">Extract Patches</span>
        </div>
        <div class="step-connector"></div>
        <div class="step-item" data-step="2">
          <div class="step-dot"><span>3</span></div>
          <span class="step-label">CNN Inference</span>
        </div>
        <div class="step-connector"></div>
        <div class="step-item" data-step="3">
          <div class="step-dot"><span>4</span></div>
          <span class="step-label">Raw Output</span>
        </div>
        <div class="step-connector"></div>
        <div class="step-item" data-step="4">
          <div class="step-dot"><span>5</span></div>
          <span class="step-label">Post-Process</span>
        </div>
      </div>

      <div class="top-bar-user">
        <span class="doctor-name">Dr. Michaels</span>
        <div class="user-avatar-sm">DM</div>
      </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">

      <!-- 3D Viewer -->
      <div class="viewer-panel">
        <div class="viewer-toolbar">
          <div class="viewer-actions">
            <button class="viewer-btn" id="btnReset" title="Reset view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
              </svg>
            </button>
            <button class="viewer-btn" id="btnFullscreen" title="Fullscreen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 3 21 3 21 9"/>
                <polyline points="9 21 3 21 3 15"/>
                <line x1="21" y1="3" x2="14" y2="10"/>
                <line x1="3" y1="21" x2="10" y2="14"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="viewer-container" id="viewerContainer">
          <div class="viewer-placeholder" id="viewerPlaceholder">
            <div class="placeholder-icon">
              <svg viewBox="0 0 80 80" fill="none">
                <path d="M40 8C31 8 24 13 22 20C19 16 14 12 9 12C5 12 2 15 2 20C2 29 10 40 20 50C22 44 25 40 30 37C33 35 37 34 40 34C43 34 47 35 50 37C55 40 58 44 60 50C70 40 78 29 78 20C78 15 75 12 71 12C66 12 61 16 58 20C56 13 49 8 40 8Z"
                  fill="rgba(122,199,232,0.1)" stroke="rgba(122,199,232,0.35)" stroke-width="1.5"/>
              </svg>
            </div>
            <p>Select a scan to begin</p>
          </div>
          <canvas id="viewerCanvas"></canvas>
        </div>

        <div class="viewer-footer">
          <span class="viewer-hint">Drag to rotate · Scroll to zoom · Right-drag to pan</span>
          <div class="mesh-badge" id="meshBadge" style="display:none">
            <span id="meshVertexCount">–</span> vertices
          </div>
        </div>
      </div>

      <!-- Step panel -->
      <div class="step-panel" id="stepPanel">
        <!-- Rendered by app.js -->
      </div>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="app.js"></script>
</body>
</html>
